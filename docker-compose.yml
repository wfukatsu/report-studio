# Report Design Studio — one-command local stack (frontend + backend + SQLite).
#
#   docker compose up --build
#
# Then open http://localhost:8080 and log in as admin / changeme.
# (Set ADMIN_PASSWORD below before the first run to avoid the default password.)
#
# Keycloak (OIDC) login alongside the local one (#499):
#
#   OIDC_ISSUER=http://localhost:8180/realms/report-studio \
#   OIDC_INTERNAL_ISSUER=http://keycloak:8080/realms/report-studio \
#   OIDC_CLIENT_ID=report-studio \
#   docker compose --profile keycloak up --build
#
# Add AUTH_MODE=oidc for Keycloak-only, AUTH_MODE=both (default once OIDC_ISSUER
# is set) to offer both, AUTH_MODE=local to keep passwords only.
# The "keycloak" profile starts a dev-mode Keycloak on http://localhost:8180
# (admin console: admin / admin) with the realm from docker/keycloak/ pre-imported:
# client "report-studio" (public, PKCE) and users kc-admin / kc-user (password
# "changeme", realm roles report-studio-admin / report-studio-user). The login
# modal then shows "Keycloak でログイン" next to the id/password form.

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # SQLite on the persisted volume; ScalarDB tables are auto-created on startup.
      SCALARDB_CONTACT_POINTS: jdbc:sqlite:/data/report-studio.db
      # Must match the URL you open in the browser (used by the CSRF Origin check).
      ALLOWED_ORIGIN: http://localhost:${APP_PORT:-8080}
      # Initial admin password. Change this before the first start for anything
      # beyond local experimentation. Cookies stay non-Secure on plain-HTTP localhost.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      # Keycloak / OIDC (#499) — all optional; unset OIDC_ISSUER = local login only.
      # Issuer as the browser (and the token "iss" claim) sees it …
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      # … and as this container reaches it (discovery / token / JWKS).
      OIDC_INTERNAL_ISSUER: ${OIDC_INTERNAL_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ADMIN_ROLE: ${OIDC_ADMIN_ROLE:-report-studio-admin}
      OIDC_USER_ROLE: ${OIDC_USER_ROLE:-}
      OIDC_LINK_LOCAL_USERS: ${OIDC_LINK_LOCAL_USERS:-false}
      # local | oidc | both — unset = local, or both once OIDC_ISSUER is set
      AUTH_MODE: ${AUTH_MODE:-}
    volumes:
      - report-studio-data:/data
    expose:
      - "8080"
    healthcheck:
      # Port 8080 only starts listening after all ScalarDB tables are initialized,
      # so a successful TCP connect is a good readiness signal. bash + /dev/tcp keeps
      # this dependency-free (no curl/wget in the slim JRE image).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Dev-only identity provider (#499). Opt in with `--profile keycloak`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["keycloak"]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fix the public hostname so the issuer in tokens is the browser-facing URL
      # (http://localhost:8180/realms/report-studio) even though the backend
      # talks to http://keycloak:8080 (OIDC_INTERNAL_ISSUER).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    restart: unless-stopped

volumes:
  report-studio-data:
