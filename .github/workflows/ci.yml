name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: every job only reads repo contents (#272).
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint / build / test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Type-check (tsc — TS7 native)
        # TS7 native is now the primary compiler (#252); this checks both
        # tsconfigs explicitly (build's `tsc -b` covers them via references,
        # this keeps the per-project check visible and cheap) (#272).
        run: npm run typecheck:native

      - name: Audit production dependencies
        # High-severity advisories in runtime deps fail CI; dev-only and
        # low/moderate advisories are Dependabot's job, not a merge gate (#272).
        run: npm audit --omit=dev --audit-level=high

      - name: Test (+ coverage ratchet)
        # --coverage enforces the ratchet thresholds in vitest.config.ts, so a
        # coverage regression fails CI instead of only being caught by whoever
        # runs test:coverage locally (#220).
        # vitest 3 (pool rewrite) — vitest 2.1.9 workers deadlocked
        # intermittently on this runner regardless of pool (forks and threads),
        # always right before ResponsesPanel.test.tsx started. The default
        # reporter keeps per-file progress visible; the step timeout is the
        # safety net. (Vitest 4 removed the old `basic` reporter — `default`
        # is its per-file-progress successor.)
        # Coverage instrumentation slows jsdom+RTL ~4x, so allow more headroom.
        timeout-minutes: 20
        run: npx vitest run --coverage --reporter=default

      - name: Storybook build
        # Catches preview-config / addon-compat breakage that the unit suite
        # never exercises — stories otherwise rot silently (#226).
        run: npm run build-storybook

  backend:
    name: Backend (JUnit + golden PDF regression)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare ScalarDB config
        run: cp server/scalardb.properties.example server/scalardb.properties

      - name: Spotless (google-java-format AOSP) check
        # Format gate wired into `check`; run explicitly so a formatting drift
        # fails fast before the (slower) test task (#226). Fix locally with
        # `./gradlew spotlessApply`.
        working-directory: server
        run: ./gradlew spotlessCheck

      - name: Test (+ coverage ratchet)
        # jacocoTestCoverageVerification enforces the ratchet thresholds in
        # build.gradle.kts (#266), so a backend coverage regression fails CI.
        working-directory: server
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-report
          path: server/build/reports/tests/test/
          retention-days: 7

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Backend runs as a Playwright webServer (dev:backend → gradlew run).
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Prepare ScalarDB config
        run: cp server/scalardb.properties.example server/scalardb.properties

      - name: Run E2E smoke
        # playwright.config.ts boots the backend (:8080) + Vite (:5173) itself.
        # Fresh backend seeds admin/changeme, which the smoke logs in with.
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-oidc:
    name: E2E (Keycloak OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # A `services:` container starts before checkout, so the realm file could not be
      # mounted; run Keycloak from a step instead (#499). Dev mode + realm import: client
      # "report-studio" (public, PKCE), users kc-admin / kc-user (password "changeme").
      - name: Start Keycloak with the dev realm
        run: |
          docker run -d --name keycloak -p 8180:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HOSTNAME=http://localhost:8180 -e KC_HTTP_ENABLED=true \
            -v "$PWD/docker/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.3 start-dev --import-realm --http-port=8080
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/report-studio/.well-known/openid-configuration >/dev/null && exit 0
            sleep 3
          done
          echo "Keycloak did not become ready"; docker logs keycloak | tail -50; exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Prepare ScalarDB config
        run: cp server/scalardb.properties.example server/scalardb.properties

      - name: Run Keycloak E2E
        # The backend is booted by playwright.config.ts (npm run dev:backend) and inherits
        # these variables; the callback goes through the Vite proxy on :5173.
        env:
          AUTH_MODE: both
          OIDC_ISSUER: http://localhost:8180/realms/report-studio
          OIDC_CLIENT_ID: report-studio
          OIDC_REDIRECT_URI: http://localhost:5173/api/v1/auth/oidc/callback
          OIDC_POST_LOGOUT_REDIRECT: http://localhost:5173/
        run: npx playwright test e2e/oidc.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-oidc
          path: playwright-report/
          retention-days: 7
